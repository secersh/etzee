name: 🔧 MCAD B11 Manufacturing

on:
  workflow_dispatch:

jobs:
  export-common:
    name: 🏭 B11 Common Parts
    permissions:
      contents: read
    uses: ./.github/workflows/mcad-export.yaml
    with:
      parts_file: hardware/b11/mcad/parts.yaml
      onshape_configuration: "List_xrEfmODFsfiBE6=Default,List_kw1ECqDsNAkjBg=Default"
      artifact_suffix: b11-common
      build: common
      variant_suffix: ""
    secrets: inherit

  export-matrix:
    name: 🏭 B11 (${{ matrix.variant_suffix }} — ${{ matrix.profile }} profile, ${{ matrix.columns }} col)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: normal
            columns: 5
            variant_suffix: 5-N
            onshape_configuration: "List_xrEfmODFsfiBE6=Default,List_kw1ECqDsNAkjBg=Default"
          - profile: normal
            columns: 6
            variant_suffix: 6-N
            onshape_configuration: "List_xrEfmODFsfiBE6=Default,List_kw1ECqDsNAkjBg=_6"
          - profile: low
            columns: 5
            variant_suffix: 5-L
            onshape_configuration: "List_xrEfmODFsfiBE6=Low_profile,List_kw1ECqDsNAkjBg=Default"
          - profile: low
            columns: 6
            variant_suffix: 6-L
            onshape_configuration: "List_xrEfmODFsfiBE6=Low_profile,List_kw1ECqDsNAkjBg=_6"
    uses: ./.github/workflows/mcad-export.yaml
    with:
      parts_file: hardware/b11/mcad/parts.yaml
      onshape_configuration: ${{ matrix.onshape_configuration }}
      artifact_suffix: b11-${{ matrix.variant_suffix }}
      build: matrix
      variant_suffix: ${{ matrix.variant_suffix }}
    secrets: inherit

  release:
    name: 🚀 Create Release
    needs: [export-common, export-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all MCAD artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mcad-*
          path: release-assets
          merge-multiple: false

      - name: Package artifacts into collection zips
        run: |
          for dir in release-assets/mcad-*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "../${name}.zip" .)
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="mcad-b11-$(date -u +'%Y%m%d%H%M%S')-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "MCAD B11 Export – run #${{ github.run_number }}" \
            --notes "Automated MCAD export of B11 STEP and STL files (run #${{ github.run_number }}, commit \`${{ github.sha }}\`)." \
            release-assets/*.zip
