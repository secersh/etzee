name: 🔧 MCAD Export

on:
  workflow_call:
    inputs:
      parts_file:
        description: "Path to parts.yaml relative to repo root"
        type: string
        required: true
      onshape_configuration:
        description: "OnShape configuration string as comma-separated key=value pairs (e.g. Param1=Value1,Param2=Value2)"
        type: string
        required: true
      artifact_suffix:
        description: "Suffix for artifact names (e.g. b11-5-MX)"
        type: string
        required: true
      build:
        description: "Build type: common or matrix"
        type: string
        required: true
      board_variant:
        description: "Board variant appended to matrix output filenames (e.g. 5-MX). Empty for common builds."
        type: string
        required: false
        default: ""
    secrets:
      ONSHAPE_API_ACCESS_KEY:
        required: true
      ONSHAPE_API_SECRET_KEY:
        required: true

jobs:
  export:
    name: 🏭 Export (${{ inputs.artifact_suffix }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate AUTH
        run: |
          AUTH=$(printf "%s:%s" "${{ secrets.ONSHAPE_API_ACCESS_KEY }}" "${{ secrets.ONSHAPE_API_SECRET_KEY }}" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          echo "AUTH=$AUTH" >> $GITHUB_ENV

      - name: Generate ENCODED_CONFIG
        run: |
          ENCODED_CONFIG=$(jq -rn --arg config "${{ inputs.onshape_configuration }}" '$config | @uri | gsub("%3B"; ";")')
          echo "ENCODED_CONFIG=$ENCODED_CONFIG" >> $GITHUB_ENV

      - name: Resolve part IDs from OnShape
        id: read_parts
        run: |
          echo "::notice:: 📋 Reading part numbers from ${{ inputs.parts_file }} (build: ${{ inputs.build }})..."

          echo "::notice:: 🔍 Fetching parts list from OnShape..."
          ONSHAPE_PARTS=$(curl -s -X 'GET' \
          "https://cad.onshape.com/api/v10/parts/d/${{ vars.DID }}/w/${{ vars.WVMID }}/e/${{ vars.EID }}?includeFlatParts=true&configuration=$ENCODED_CONFIG" \
          -H "Accept: application/json" \
          -H "Authorization: Basic $AUTH")

          ONSHAPE_PARTS_JSON="$ONSHAPE_PARTS" \
          BUILD_TYPE="${{ inputs.build }}" \
          PARTS_FILE="${{ inputs.parts_file }}" \
          python3 - <<'EOF'
          import json, sys, os, yaml

          with open(os.environ['PARTS_FILE']) as f:
              data = yaml.safe_load(f)

          build_type = os.environ['BUILD_TYPE']
          all_parts = [p for p in data['parts'] if p.get('build', 'common') == build_type]

          if not all_parts:
              print(f'::notice:: No parts found for build type: {build_type}', file=sys.stderr)
              sys.exit(0)

          onshape_parts = json.loads(os.environ['ONSHAPE_PARTS_JSON'])
          id_map = {p['partNumber']: p['partId'] for p in onshape_parts if p.get('partNumber')}

          missing = [p['part_number'] for p in all_parts if p['part_number'] not in id_map]
          if missing:
              for n in missing:
                  print(f'Part number not found in OnShape: {n}', file=sys.stderr)
              sys.exit(1)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for fmt in ['step', 'stl']:
                  fmt_parts = [p for p in all_parts if fmt in p.get('formats', [])]
                  out.write(f"{fmt}_names={','.join(p['part_number'] for p in fmt_parts)}\n")
                  out.write(f"{fmt}_ids={','.join(id_map[p['part_number']] for p in fmt_parts)}\n")
          EOF

      - name: Export STEP files
        if: steps.read_parts.outputs.step_names != ''
        env:
          PART_IDS: ${{ steps.read_parts.outputs.step_ids }}
          PART_NAMES: ${{ steps.read_parts.outputs.step_names }}
          BOARD_VARIANT: ${{ inputs.board_variant }}
        run: |
          echo "::notice:: 📐 Exporting STEP files (${{ inputs.artifact_suffix }})..."
          mkdir -p manufacturing/step

          IFS=',' read -ra NAMES <<< "$PART_NAMES"
          IFS=',' read -ra IDS <<< "$PART_IDS"

          for i in "${!NAMES[@]}"; do
            NAME="${NAMES[$i]}"
            PID="${IDS[$i]}"
            OUTPUT_NAME="${NAME}${BOARD_VARIANT:+-${BOARD_VARIANT}}"

            echo "::notice:: 📤 Submitting STEP export for part: $NAME..."

            JSON_BODY=$(jq -n \
              --arg partIds "$PID" \
              '{resolution:"FINE",storeInDocument:false,partIds:$partIds,formatName:"STEP",grouping:false,specifyUnits:true,unit:"MILLIMETER",scale:"1.0"}')

            SUBMIT_RES=$(curl -s -X 'POST' \
            "https://cad.onshape.com/api/v10/partstudios/d/${{ vars.DID }}/w/${{ vars.WVMID }}/e/${{ vars.EID }}/translations" \
            -H "Accept: application/json" \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            -d "$JSON_BODY")

            HREF=$(echo "$SUBMIT_RES" | jq -r '.href')
            [ -z "$HREF" ] || [ "$HREF" == "null" ] && { echo "::error:: 🚨 Failed to submit STEP export for: $NAME (response: $(echo "$SUBMIT_RES" | jq -c '.'))"; exit 1; }

            ATTEMPTS=0; MAX_ATTEMPTS=60
            while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
              STATUS_RES=$(curl -s -X 'GET' "$HREF" -H "Accept: application/json" -H "Authorization: Basic $AUTH")
              STATUS=$(echo "$STATUS_RES" | jq -r '.requestState')
              [ -z "$STATUS" ] && { echo "::error:: 🚨 Failed to retrieve STEP export status for: $NAME"; exit 1; }
              [ "$STATUS" == "DONE" ] && { FID=$(echo "$STATUS_RES" | jq -r '.resultExternalDataIds[0]'); break; }
              [ "$STATUS" == "FAILED" ] && { echo "::error:: 🚨 STEP export failed for: $NAME"; exit 1; }
              sleep 5; ATTEMPTS=$((ATTEMPTS + 1))
            done
            [ $ATTEMPTS -ge $MAX_ATTEMPTS ] && { echo "::error:: 🚨 STEP export timed out for: $NAME"; exit 1; }

            curl -s -X 'GET' \
            "https://cad.onshape.com/api/v10/documents/d/${{ vars.DID }}/externaldata/$FID" \
            -H "Accept: application/octet-stream" -H "Authorization: Basic $AUTH" \
            -o "manufacturing/step/${OUTPUT_NAME}.zip"

            TMPDIR="manufacturing/step/${OUTPUT_NAME}_tmp"
            unzip -o "manufacturing/step/${OUTPUT_NAME}.zip" -d "$TMPDIR"
            STEP_FILE=$(find "$TMPDIR" -maxdepth 1 -iname "*.step" | head -1)
            [ -z "$STEP_FILE" ] && { echo "::error:: 🚨 No STEP file in zip for: $NAME"; exit 1; }
            mv "$STEP_FILE" "manufacturing/step/${OUTPUT_NAME}.step"
            rm -rf "$TMPDIR" "manufacturing/step/${OUTPUT_NAME}.zip"
            echo "::notice:: ✅ $OUTPUT_NAME.step"
          done

      - name: Export STL files
        if: steps.read_parts.outputs.stl_names != ''
        env:
          PART_IDS: ${{ steps.read_parts.outputs.stl_ids }}
          PART_NAMES: ${{ steps.read_parts.outputs.stl_names }}
          BOARD_VARIANT: ${{ inputs.board_variant }}
        run: |
          echo "::notice:: 🖨️ Exporting STL files (${{ inputs.artifact_suffix }})..."
          mkdir -p manufacturing/stl

          IFS=',' read -ra NAMES <<< "$PART_NAMES"
          IFS=',' read -ra IDS <<< "$PART_IDS"

          for i in "${!NAMES[@]}"; do
            NAME="${NAMES[$i]}"
            PID="${IDS[$i]}"
            OUTPUT_NAME="${NAME}${BOARD_VARIANT:+-${BOARD_VARIANT}}"

            echo "::notice:: 📤 Submitting STL export for part: $NAME..."

            JSON_BODY=$(jq -n \
              --arg partIds "$PID" \
              '{storeInDocument:false,partIds:$partIds,formatName:"STL",grouping:false,specifyUnits:true,unit:"MILLIMETER",scale:"1.0",angularTolerance:0.05,chordTolerance:0.01}')

            SUBMIT_RES=$(curl -s -X 'POST' \
            "https://cad.onshape.com/api/v10/partstudios/d/${{ vars.DID }}/w/${{ vars.WVMID }}/e/${{ vars.EID }}/translations" \
            -H "Accept: application/json" \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            -d "$JSON_BODY")

            HREF=$(echo "$SUBMIT_RES" | jq -r '.href')
            [ -z "$HREF" ] || [ "$HREF" == "null" ] && { echo "::error:: 🚨 Failed to submit STL export for: $NAME"; exit 1; }

            ATTEMPTS=0; MAX_ATTEMPTS=60
            while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
              STATUS_RES=$(curl -s -X 'GET' "$HREF" -H "Accept: application/json" -H "Authorization: Basic $AUTH")
              STATUS=$(echo "$STATUS_RES" | jq -r '.requestState')
              [ -z "$STATUS" ] && { echo "::error:: 🚨 Failed to retrieve STL export status for: $NAME"; exit 1; }
              [ "$STATUS" == "DONE" ] && { FID=$(echo "$STATUS_RES" | jq -r '.resultExternalDataIds[0]'); break; }
              [ "$STATUS" == "FAILED" ] && { echo "::error:: 🚨 STL export failed for: $NAME"; exit 1; }
              sleep 5; ATTEMPTS=$((ATTEMPTS + 1))
            done
            [ $ATTEMPTS -ge $MAX_ATTEMPTS ] && { echo "::error:: 🚨 STL export timed out for: $NAME"; exit 1; }

            curl -s -X 'GET' \
            "https://cad.onshape.com/api/v10/documents/d/${{ vars.DID }}/externaldata/$FID" \
            -H "Accept: application/octet-stream" -H "Authorization: Basic $AUTH" \
            -o "manufacturing/stl/${OUTPUT_NAME}.zip"

            TMPDIR="manufacturing/stl/${OUTPUT_NAME}_tmp"
            unzip -o "manufacturing/stl/${OUTPUT_NAME}.zip" -d "$TMPDIR"
            STL_FILE=$(find "$TMPDIR" -maxdepth 1 -iname "*.stl" | head -1)
            [ -z "$STL_FILE" ] && { echo "::error:: 🚨 No STL file in zip for: $NAME"; exit 1; }
            mv "$STL_FILE" "manufacturing/stl/${OUTPUT_NAME}.stl"
            rm -rf "$TMPDIR" "manufacturing/stl/${OUTPUT_NAME}.zip"
            echo "::notice:: ✅ $OUTPUT_NAME.stl"
          done

      - name: Upload STEP artifact
        if: steps.read_parts.outputs.step_names != ''
        uses: actions/upload-artifact@v4
        with:
          name: mcad-step-${{ inputs.artifact_suffix }}
          path: manufacturing/step/*.step

      - name: Upload STL artifact
        if: steps.read_parts.outputs.stl_names != ''
        uses: actions/upload-artifact@v4
        with:
          name: mcad-stl-${{ inputs.artifact_suffix }}
          path: manufacturing/stl/*.stl
