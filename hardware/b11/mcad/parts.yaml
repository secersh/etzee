# Lists etzee part numbers to be exported by the MCAD manufacturing workflow.
# Part numbers must match the partNumber property set in OnShape
# (right-click a part → Properties → Part Number).
# Only parts listed here will be exported.
#
# build:   common  → exported once, filename is the part number
#          matrix  → exported once per board variant, filename gets the board variant suffix (e.g. -5-MX)
# formats: step    → STEP file (3D and PCB outline source)
#          stl     → STL file (3D printing)
#
# PCB outlines are derived from STEP exports by hardware/b11/tools/fetch-outlines.py:
#   common PCB outlines          → hardware/b11/mcad/pcb-outlines/common/
#   switch-family PCB outlines   → hardware/b11/mcad/pcb-outlines/{MX,CHOC-V2,KS-33}/

parts:

  # common parts — exported once, no board variant suffix
  - part_number: ETZ-B11-TC       # Top cap
    formats: [step, stl]
    build: common

  - part_number: ETZ-B11-LGB      # Logic board PCB
    formats: [step, stl]
    build: common

  # matrix parts — exported once per board variant (5-MX, 5-CHOC-V2, 5-KS-33, etc.)
  - part_number: ETZ-B11-LB       # Left base
    formats: [step, stl]
    build: matrix

  - part_number: ETZ-B11-RB       # Right base
    formats: [step, stl]
    build: matrix

  - part_number: ETZ-B11-LSP      # Left switch plate PCB
    formats: [step, stl]
    build: matrix

  - part_number: ETZ-B11-RSP      # Right switch plate PCB
    formats: [step, stl]
    build: matrix

  - part_number: ETZ-B11-LSC      # Left switch carrier PCB
    formats: [step, stl]
    build: matrix

  - part_number: ETZ-B11-RSC      # Right switch carrier PCB
    formats: [step, stl]
    build: matrix
